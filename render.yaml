services:
  - type: web
    name: hpy-growth
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: >-
      APP_ORIGIN="${APP_ORIGIN:-$RENDER_EXTERNAL_URL}" node server/index.mjs
    healthCheckPath: /api/session
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/becoming
      - key: APP_PASSCODE
        sync: false
    disk:
      name: becoming-private-data
      mountPath: /var/data
      sizeGB: 1
